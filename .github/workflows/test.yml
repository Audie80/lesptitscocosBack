name: Unit Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  mocha-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Mocha tests
        run: npm run test
